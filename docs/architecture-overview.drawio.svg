    <rect x="460" y="510" width="180" height="70" rx="9" class="box" stroke="#6c8ebf"/><text x="550" y="536" class="label" font-weight="700">Gin + Huma</text><text x="550" y="558" class="small">HTTP / OpenAPI 3.1</text><text x="550" y="574" class="small">ReDoc / Scalar</text>
    <rect x="670" y="510" width="180" height="70" rx="9" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="760" y="534" class="label" font-weight="700">路由边界守卫</text><text x="760" y="555" class="small">scope isolation</text><text x="760" y="572" class="small">所有插件路由归属校验</text>
    <rect x="260" y="630" width="170" height="72" rx="9" class="box" stroke="#6c8ebf"/><text x="345" y="659" class="label" font-weight="700">GORM 数据访问</text><text x="345" y="681" class="small">显式选择存储</text>
    <rect x="460" y="630" width="180" height="78" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="550" y="656" class="label" font-weight="700">Auth addon</text><text x="550" y="678" class="small">V2 / priority 10</text><text x="550" y="696" class="small">全局 JWT middleware</text>
    <rect x="670" y="630" width="180" height="78" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="760" y="656" class="label" font-weight="700">RBAC addon</text><text x="760" y="678" class="small">V2 / requires auth</text><text x="760" y="696" class="small">作用域权限 middleware</text>
  </g>
  <g>
    <rect x="920" y="400" width="170" height="70" rx="9" class="box" stroke="#82b366"/><text x="1005" y="428" class="label" font-weight="700">Vue 应用壳</text><text x="1005" y="451" class="small">Vite / Pinia</text>
