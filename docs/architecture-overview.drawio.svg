    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4f81bd"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#82b366"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9673a6"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d79b00"/></marker>
    <style>
      text{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#1f2937}.box{fill:#fff;stroke-width:2}.label{font-size:14px;text-anchor:middle}.small{font-size:12px;text-anchor:middle;fill:#4b5563}.head{font-size:17px;font-weight:700}.container{stroke-width:2}.edge{fill:none;stroke-width:2}.dash{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
