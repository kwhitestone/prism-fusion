  <rect x="30" y="410" width="160" height="82" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="110" y="443" class="label" font-weight="700">浏览器 / API Client</text><text x="110" y="466" class="small">页面、Token、HTTP 请求</text>
  <rect x="220" y="80" width="1340" height="180" rx="12" fill="#e8f4f8" stroke="#4f81bd" class="container"/>
  <path d="M220 114 H1560" stroke="#4f81bd" stroke-width="2"/><text x="245" y="104" class="head">业务宿主（prism-example-site）— 固定版本、选择插件、提供配置与部署</text>
  <g>
    <rect x="240" y="132" width="200" height="88" rx="10" class="box" stroke="#4f81bd"/><text x="340" y="158" class="label" font-weight="700">版本边界</text><text x="340" y="181" class="small">git submodule</text><text x="340" y="201" class="small">锁定 framework commit</text>
    <rect x="490" y="132" width="200" height="88" rx="10" class="box" stroke="#4f81bd"/><text x="590" y="158" class="label" font-weight="700">后端组合入口</text><text x="590" y="181" class="small">blank imports + config</text><text x="590" y="201" class="small">go.work / replace</text>
    <rect x="740" y="132" width="200" height="88" rx="10" class="box" stroke="#4f81bd"/><text x="840" y="158" class="label" font-weight="700">前端组合入口</text><text x="840" y="181" class="small">registerExternalPlugins</text><text x="840" y="201" class="small">pnpm workspace</text>
    <rect x="990" y="132" width="220" height="88" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1100" y="158" class="label" font-weight="700">业务后端 addons</text><text x="1100" y="181" class="small">V2 example</text><text x="1100" y="201" class="small">V1 compatibility samples</text>
    <rect x="1260" y="132" width="220" height="88" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/><text x="1370" y="158" class="label" font-weight="700">业务前端 addons</text><text x="1370" y="181" class="small">页面、路由、菜单、权限</text><text x="1370" y="201" class="small">PluginModule</text>
  </g>
