<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" data-drawio-source="architecture-overview.drawio">
  <title id="title">Prism Fusion V2.0 整体架构</title>
  <desc id="desc">业务宿主组合 Prism Fusion 后端与前端运行时，并通过插件注册表、可选 Auth/RBAC addon 和显式数据存储形成模块化单体。</desc>
  <metadata>Canonical editable draw.io source: architecture-overview.drawio</metadata>
