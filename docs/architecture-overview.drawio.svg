    <rect x="1330" y="400" width="180" height="70" rx="9" fill="#fff2cc" stroke="#d6b656" stroke-width="2"/><text x="1420" y="424" class="label" font-weight="700">PluginModule</text><text x="1420" y="446" class="small">routes / components</text><text x="1420" y="462" class="small">install / setup / destroy</text>
    <rect x="920" y="510" width="170" height="70" rx="9" class="box" stroke="#82b366"/><text x="1005" y="536" class="label" font-weight="700">Session + HTTP</text><text x="1005" y="558" class="small">Token refresh / epoch</text><text x="1005" y="574" class="small">API envelope</text>
    <rect x="1120" y="510" width="180" height="70" rx="9" class="box" stroke="#82b366"/><text x="1210" y="538" class="label" font-weight="700">Router + Menu</text><text x="1210" y="560" class="small">插件快照 / 菜单元数据</text>
    <rect x="1330" y="510" width="180" height="70" rx="9" fill="#f8cecc" stroke="#b85450" stroke-width="2"/><text x="1420" y="536" class="label" font-weight="700">UI 权限层</text><text x="1420" y="558" class="small">v-perms / 可见性</text><text x="1420" y="574" class="small">非最终授权边界</text>
    <rect x="920" y="630" width="170" height="72" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="1005" y="659" class="label" font-weight="700">框架前端 addons</text><text x="1005" y="681" class="small">import.meta.glob</text>
    <rect x="1120" y="630" width="180" height="72" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="2"/><text x="1210" y="659" class="label" font-weight="700">业务前端 addons</text><text x="1210" y="681" class="small">显式注入</text>
    <rect x="1330" y="630" width="180" height="72" rx="9" class="box" stroke="#82b366"/><text x="1420" y="656" class="label" font-weight="700">框架核心上报</text><text x="1420" y="678" class="small">菜单 + 权限声明</text><text x="1420" y="695" class="small">当前仅日志观测</text>
  </g>
