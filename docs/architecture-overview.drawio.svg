  <g>
    <rect x="260" y="400" width="170" height="70" rx="9" class="box" stroke="#6c8ebf"/><text x="345" y="428" class="label" font-weight="700">配置与日志</text><text x="345" y="451" class="small">Viper / Zap</text>
