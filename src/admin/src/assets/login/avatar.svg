<svg viewBox="0 0 320 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 入射光 -->
  <line x1="5" y1="50" x2="28" y2="50" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 三棱镜 - 使用多层叠加模拟渐变 -->
  <polygon points="50,15 85,75 15,75" fill="#3B82F6"/>
  <polygon points="50,15 67,75 15,75" fill="#22C55E" opacity="0.7"/>
  <polygon points="50,15 85,75 50,75" fill="#8B5CF6" opacity="0.5"/>
  <polygon points="50,22 78,68 22,68" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>

  <!-- 折射光束 -->
  <line x1="75" y1="38" x2="98" y2="22" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="50" x2="103" y2="50" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>
  <line x1="75" y1="62" x2="98" y2="78" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>

  <!-- 光点 -->
  <circle cx="100" cy="20" r="4" fill="#22C55E"/>
  <circle cx="106" cy="50" r="4" fill="#3B82F6"/>
  <circle cx="100" cy="80" r="4" fill="#8B5CF6"/>

  <!-- 文字 -->
  <text x="125" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#1E293B">Prism</text>
  <text x="125" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" fill="#64748B">Fusion</text>
</svg>
