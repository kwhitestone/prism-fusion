# 系统配置
system:
  env: 'local'  # 环境：public线上环境 local开发环境
  addr: 3180     # 服务监听端口

# JWT签名（auth.provider=builtin 时使用）
jwt:
  signing-key: 'Prism-Fusion-Secret-Key'
  expires-time: '7d'   # 过期时间
  buffer-time: '1d'    # 缓冲时间
  issuer: 'Prism-Fusion' # 签发者

# 认证配置
auth:
  provider: 'builtin'  # builtin(内置JWT) 或业务插件提供的 provider（如 oauth）

# 权限控制配置
rbac:
  provider: 'builtin'  # builtin(内置角色管理) 或业务插件提供的 provider（如 casbin）

# Zap日志配置
zap:
  level: 'info'                # 日志级别
  prefix: '[PRISM]'      # 日志前缀
  format: 'console'            # 输出格式
  director: 'log'              # 日志文件夹
  encode-level: 'LowercaseColorLevelEncoder'  # 编码级别
  stacktrace-key: 'stacktrace' # 栈名
  max-age: 0      # 日志留存时间
  show-line: true # 显示行
  log-in-console: true # 输出控制台

# MySQL配置（优先使用，如果配置了MySQL则忽略SQLite）
mysql:
  host: '${DB_HOST}'           # 服务器地址，支持环境变量
  port: '${DB_PORT}'           # 端口
  db-name: '${DB_NAME}'        # 数据库名
  username: '${DB_USER}'       # 数据库用户名
  password: '${DB_PASSWORD}'   # 数据库密码
  config: 'charset=utf8mb4&parseTime=True&loc=Local'  # 高级配置
  max-idle-conns: 10           # 空闲连接数
  max-open-conns: 100          # 最大连接数
  log-mode: 'error'            # 日志模式
  log-zap: false               # 是否使用zap日志

# SQLite配置（MySQL未配置时使用）
sqlite:
  path: './prism_fusion.db'     # 数据库文件路径
  max-idle-conns: 10           # 空闲连接数
  max-open-conns: 100          # 最大连接数
  log-mode: 'error'            # 日志模式
  log-zap: false               # 是否使用zap日志

# 验证码配置
captcha:
  key-long: 6           # 验证码长度
  img-width: 240        # 验证码宽度
  img-height: 80        # 验证码高度
  open-captcha: 0       # 防爆破验证码开启此数 0代表每次登录都需要验证码
  open-captcha-timeout: 3600  # 防爆破验证码超时时间

# 跨域配置
cors:
  mode: 'strict-whitelist' # 跨域模式：strict-whitelist（严格白名单）或 allow-all（允许所有）
  whitelist:
    # 仅需配置真正的跨域场景，同源请求会自动放行
    - allow-origin: 'http://localhost:3188'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true